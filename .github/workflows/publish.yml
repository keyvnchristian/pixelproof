name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./package.json'),c=require('./.claude-plugin/plugin.json');if(p.version!=='$TAG'||c.version!=='$TAG'){console.error('version mismatch: package',p.version,'plugin',c.version,'tag','$TAG');process.exit(1)}"
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
